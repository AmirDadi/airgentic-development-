name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      # Vite 8 requires ^20.19.0 || >=22.12.0; keep this in step with the
      # engines constraint when bumping.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Advisories shouldn't block a PR that didn't introduce them, but we
      # want them visible — the annotation is the signal, not a red check.
      - name: Audit (advisory only)
        run: npm audit --audit-level=high
        continue-on-error: true
